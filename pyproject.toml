[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aviation-tracker"
version = "1.0.0"
description = "Курсовая работа: самолёты в воздушном пространстве выбранной страны"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --basetemp=.pytest-tmp --cov=aviation_tracker --cov-report=term-missing --cov-fail-under=70"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["aviation_tracker"]

